apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bookify-server-monitor
  namespace: monitoring
  labels:
    release: my-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: bookify-server
  endpoints:
    - port: http-5000
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
  namespaceSelector:
    matchNames:
      - dev

