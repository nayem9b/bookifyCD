apiVersion: v1
kind: Pod
metadata:
  name: debug-pod-3
  namespace: bookify
spec:
  containers:
  - name: debug-container
    image: nayem9b/bookify-backend-github-build:latest
    command: ['sh', '-c']
    args:
    - |
      echo "DATABASE_URL length: $(echo $DATABASE_URL | wc -c)"
      echo "DATABASE_URL (with quotes): \"$DATABASE_URL\""
      echo "Expected length without newline: 112"
      cat << 'EOF' > check-connection.js
      const url = process.env.DATABASE_URL;
      console.log("Connection string:", url);
      console.log("Length:", url.length);
      console.log("Last char code:", url.charCodeAt(url.length - 1));
      console.log("Has trailing newline?", url.endsWith('\n'));
      EOF
      node check-connection.js
      sleep 300
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: bookify-backend-secret
          key: DATABASE_URL
  restartPolicy: Never