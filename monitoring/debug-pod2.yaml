apiVersion: v1
kind: Pod
metadata:
  name: debug-pod-2
  namespace: bookify
spec:
  containers:
  - name: debug-container
    image: nayem9b/bookify-backend-github-build:latest
    command: ['sh', '-c']
    args:
    - |
      echo "DATABASE_URL length: $(echo $DATABASE_URL | wc -c)"
      echo "DATABASE_URL (quoted): \"$DATABASE_URL\""
      echo "DB_USER length: $(echo $DB_USER | wc -c)"
      echo "DB_USER (quoted): \"$DB_USER\""
      sleep 300
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: bookify-backend-secret
          key: DATABASE_URL
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: bookify-backend-secret
          key: DB_USER
  restartPolicy: Never