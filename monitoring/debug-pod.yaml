apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  namespace: bookify
spec:
  containers:
  - name: debug-container
    image: nayem9b/bookify-backend-github-build:latest
    command: ['sh', '-c']
    args:
    - |
      echo "DATABASE_URL length: $(echo $DATABASE_URL | wc -c)"
      echo "DATABASE_URL (quoted): \"$DATABASE_URL\""
      echo "DATABASE_URL (encoded): $(echo $DATABASE_URL | base64 -w 0)"
      echo "Sleeping for 300 seconds..."
      sleep 300
    env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: bookify-backend-secret
          key: DATABASE_URL
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: bookify-backend-secret
          key: DB_USER
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: bookify-backend-secret
          key: DB_PASSWORD
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: bookify-backend-secret
          key: REDIS_URL
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: bookify-backend-secret
          key: JWT_SECRET
  restartPolicy: Never